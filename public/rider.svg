<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow circle -->
  <circle cx="25" cy="25" r="24" fill="rgba(255,107,53,0.2)" />
  
  <!-- Main circle background -->
  <circle cx="25" cy="25" r="20" fill="#FF6B35" />
  
  <!-- Motorcycle icon -->
  <g transform="translate(25, 25)">
    <!-- Wheels -->
    <circle cx="-8" cy="6" r="3" fill="white" stroke="white" stroke-width="1"/>
    <circle cx="8" cy="6" r="3" fill="white" stroke="white" stroke-width="1"/>
    
    <!-- Body -->
    <path d="M -6 2 L -2 -4 L 2 -4 L 6 2" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Rider head -->
    <circle cx="0" cy="-6" r="2.5" fill="white"/>
    
    <!-- Handlebars -->
    <line x1="-2" y1="-4" x2="-4" y2="-2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Border -->
  <circle cx="25" cy="25" r="20" fill="none" stroke="white" stroke-width="2" />
</svg>
